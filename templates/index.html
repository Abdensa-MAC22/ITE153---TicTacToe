<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abdensa Game Go</title>

<style>
/* ===================== RESET ===================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter','Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0a0a0a;
    overflow:hidden;
    color:white;
}

/* ===================== SOFT BACKGROUND ===================== */
body::before,
body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.12;
}

body::before{
    background:#ffffff;
    top:-180px;
    left:-180px;
}

body::after{
    background:#888888;
    bottom:-180px;
    right:-180px;
}

/* ===================== CONTAINER ===================== */
.container{
    width:100%;
    max-width:720px;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.06);
}

/* ===================== SCREENS ===================== */
.screen{
    width:100%;
    height:100%;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.screen.active{
    display:flex;
}

/* ===================== TITLE ===================== */
.title{
    font-size:82px;
    line-height:0.9;
    text-align:center;
    font-weight:900;
    letter-spacing:-4px;
    color:#ffffff;
}

.brand{
    margin-top:18px;
    color:#9e9e9e;
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
}

/* ===================== BUTTONS ===================== */
button{
    border:none;
    outline:none;
    cursor:pointer;
    transition:0.25s ease;
}

button:hover{
    transform:translateY(-2px);
}

/* ===================== PLAY BUTTON ===================== */
.play-btn{
    width:80px;
    height:60px;
    margin-top:30px;
    margin-bottom:40px;
    border-radius:2%;

   
    color:rgb(0, 0, 0);

    font-size:20px;
    font-weight:bold;

    box-shadow:
        0 8px 30px rgba(255,255,255,0.18);
}

.play-btn:hover{
    box-shadow:
        0 12px 35px rgba(255,255,255,0.28);
}

/* ===================== MENU ===================== */
.menu-box{
    width:100%;
    max-width:340px;

    padding:28px;
    border-radius:28px;

    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter: blur(14px);

    display:flex;
    flex-direction:column;
    gap:16px;
}

/* ===================== MENU BUTTON ===================== */
.menu-btn{
    width:100%;
    padding:16px;

    border-radius:14px;

    background:#161616;
    border:1px solid rgba(255,255,255,0.08);

    color:white;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.3px;
}

.menu-btn:hover{
    background:#222222;
    border-color:rgba(255,255,255,0.15);
}

/* ===================== DIFFICULTY ===================== */
.difficulty{
    display:flex;
    gap:10px;
}

.diff-btn{
    flex:1;
    padding:12px;

    border-radius:12px;

    background:#111111;
    border:1px solid rgba(255,255,255,0.08);

    color:#cfcfcf;
    font-weight:600;
}

.diff-btn.active{
    background:white;
    color:black;
}

/* ===================== GAME ===================== */
.pause-btn{
    position:absolute;
    top:24px;
    right:24px;

    width:56px;
    height:56px;

    border-radius:16px;

    background:#161616;
    border:1px solid rgba(255,255,255,0.08);

    color:white;
    font-size:22px;
}

.pause-btn:hover{
    background:#242424;
}

/* ===================== STATUS ===================== */
.status{
    margin-bottom:24px;

    color:white;
    font-size:28px;
    font-weight:700;
    letter-spacing:-1px;
}

/* ===================== BOARD ===================== */
.board{
    display:grid;
    grid-template-columns:repeat(3,110px);
    gap:12px;

    padding:16px;
    border-radius:28px;

    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);
}

/* ===================== CELL ===================== */
.cell{
    width:110px;
    height:110px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:56px;
    font-weight:800;

    border-radius:20px;

    background:#121212;
    border:1px solid rgba(255,255,255,0.06);

    cursor:pointer;

    transition:0.2s ease;
}

.cell:hover{
    background:#1a1a1a;
    transform:scale(1.03);
}

.cell.X{
    color:white;
}

.cell.O{
    color:#9d9d9d;
}

/* ===================== SCOREBOARD ===================== */
.scoreboard{
    position:absolute;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    gap:12px;

    padding:12px 14px;

    border-radius:18px;

    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter: blur(12px);
}

.score-box{
    min-width:90px;
    text-align:center;

    padding:10px 14px;
    border-radius:12px;

    background:#151515;
    border:1px solid rgba(255,255,255,0.06);

    color:#d7d7d7;
    font-weight:600;
}

/* ===================== OVERLAY ===================== */
.overlay{
    position:absolute;
    inset:0;

    display:none;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
}

.overlay.active{
    display:flex;
}

.overlay-box{
    width:100%;
    max-width:320px;

    padding:26px;

    border-radius:28px;

    background:#111111;
    border:1px solid rgba(255,255,255,0.08);

    display:flex;
    flex-direction:column;
    gap:14px;
}

/* ===================== MOBILE ===================== */
@media(max-width:600px){

    .title{
        font-size:64px;
    }

    .board{
        grid-template-columns:repeat(3,90px);
    }

    .cell{
        width:90px;
        height:90px;
        font-size:48px;
    }

    .scoreboard{
        flex-wrap:wrap;
        justify-content:center;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="home-screen" class="screen active">
        <div class="title">TIC<br>TAC<br>TOE</div>

        <button id="play-btn" class="play-btn">▶</button>

        <div class="brand">Minimax Algorithm in a Tic-Tac-Toe game  </div>
        <div class="brand">Abdensa & Hosni • Game Go</div>

    </div>

    <!-- MODE -->
    <div id="mode-screen" class="screen">

        <div class="menu-box">

            <button id="pvp-btn" class="menu-btn">
                👥 Player vs Player
            </button>

            <button id="ai-btn" class="menu-btn">
                🤖 Player vs A.I.
            </button>

            <div class="difficulty">
                <button class="diff-btn active" data-level="easy">
                    Easy
                </button>

                <button class="diff-btn" data-level="medium">
                    Medium
                </button>

                <button class="diff-btn" data-level="hard">
                    Hard
                </button>
            </div>

            <button id="back-btn" class="menu-btn">
                ← Back
            </button>

        </div>
    </div>

    <!-- GAME -->
    <div id="game-screen" class="screen">

        <button id="pause-btn" class="pause-btn">⏸</button>

        <div id="status" class="status">
            Player X Turn
        </div>

        <div id="board" class="board"></div>

        <!-- SCOREBOARD -->
        <div class="scoreboard">

            <div class="score-box">
                X: <span id="x-score">0</span>
            </div>

            <div class="score-box">
                O: <span id="o-score">0</span>
            </div>

            <div class="score-box">
                Draw: <span id="draw-score">0</span>
            </div>


        </div>

    </div>

    <!-- OVERLAY -->
    <div id="overlay" class="overlay">

        <div class="overlay-box">

            <button id="resume-btn" class="menu-btn">
                Resume
            </button>

            <button id="restart-btn" class="menu-btn">
                Restart
            </button>

            <button id="exit-btn" class="menu-btn">
                Exit
            </button>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
