<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdensa Game Go</title>

<style>
/* ===================== RESET ===================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#05060a;
    overflow:hidden;
}

/* ===================== CYBER GLOW BACKGROUND ===================== */
body::before{
    content:'';
    position:absolute;
    width:600px;
    height:600px;
    background:radial-gradient(circle,#00f5ff33,#0000);
    top:-200px;
    left:-200px;
    filter:blur(60px);
}

body::after{
    content:'';
    position:absolute;
    width:600px;
    height:600px;
    background:radial-gradient(circle,#ff00ff33,#0000);
    bottom:-200px;
    right:-200px;
    filter:blur(60px);
}

/* ===================== CONTAINER ===================== */
.container{
    width:100%;
    max-width:720px;
    height:100vh;
    position:relative;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    box-shadow:0 0 40px rgba(0,255,255,0.15);
}

/* ===================== SCREENS ===================== */
.screen{
    width:100%;
    height:100%;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.screen.active{
    display:flex;
}

/* ===================== TITLE ===================== */
.title{
    font-size:88px;
    line-height:0.9;
    text-align:center;
    font-weight:900;
    color:#00f5ff;
    text-shadow:0 0 10px #00f5ff, 0 0 40px #00f5ff;
    letter-spacing:4px;
}

/* ===================== BRAND ===================== */
.brand{
    margin-top:20px;
    color:#ff00ff;
    font-weight:bold;
    letter-spacing:2px;
    text-shadow:0 0 10px #ff00ff;
}

/* ===================== BUTTON EFFECT ===================== */
button{
    transition:0.2s ease;
}

button:hover{
    transform:scale(1.05);
}

/* ===================== PLAY BUTTON ===================== */
.play-btn{
    width:120px;
    height:120px;
    margin-top:40px;
    border-radius:50%;
    border:2px solid #00f5ff;
    background:transparent;
    color:#00f5ff;
    font-size:50px;
    cursor:pointer;
    box-shadow:0 0 25px #00f5ff;
}

/* ===================== MENU ===================== */
.menu-box{
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* ===================== MENU BUTTON ===================== */
.menu-btn{
    width:280px;
    padding:15px;
    border-radius:12px;
    border:1px solid #00f5ff;
    background:transparent;
    color:#00f5ff;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #00f5ff22;
}

.menu-btn:hover{
    box-shadow:0 0 20px #00f5ff;
}

/* ===================== DIFFICULTY ===================== */
.difficulty{
    display:flex;
    gap:10px;
}

.diff-btn{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid #ff00ff;
    background:transparent;
    color:#ff00ff;
    font-weight:bold;
    cursor:pointer;
}

.diff-btn.active{
    background:#ff00ff22;
    box-shadow:0 0 15px #ff00ff;
}

/* ===================== GAME ===================== */
.pause-btn{
    position:absolute;
    top:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:12px;
    border:1px solid #00f5ff;
    background:transparent;
    color:#00f5ff;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 0 15px #00f5ff33;
}

.status{
    margin-bottom:20px;
    color:#00f5ff;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 0 10px #00f5ff;
}

/* ===================== BOARD ===================== */
.board{
    display:grid;
    grid-template-columns:repeat(3,110px);
    gap:10px;
    padding:15px;
    border-radius:20px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.1);
}

.cell{
    width:110px;
    height:110px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
    font-weight:bold;
    cursor:pointer;
    border-radius:12px;
    background:rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.1);
    transition:0.2s;
}

.cell:hover{
    box-shadow:0 0 15px #00f5ff;
}

.cell.X{
    color:#00f5ff;
    text-shadow:0 0 10px #00f5ff;
}

.cell.O{
    color:#ff00ff;
    text-shadow:0 0 10px #ff00ff;
}

/* ===================== SCOREBOARD ===================== */
.scoreboard{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    padding:10px 20px;
    border-radius:15px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    color:white;
}

.score-box{
    padding:5px 10px;
    border-radius:8px;
    border:1px solid #00f5ff;
}

/* ===================== OVERLAY ===================== */
.overlay{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.6);
}

.overlay.active{
    display:flex;
}

.overlay-box{
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    display:flex;
    flex-direction:column;
    gap:15px;
}
</style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="home-screen" class="screen active">
        <div class="title">TIC<br>TAC<br>TOE</div>
        <button id="play-btn" class="play-btn"> ▶</button>
        <div class="brand">Abdensa & Hosni; Game Go</div>
    </div>

    <!-- MODE -->
    <div id="mode-screen" class="screen">
        <div class="menu-box">

            <button id="pvp-btn" class="menu-btn">👥 Player vs Player</button>
            <button id="ai-btn" class="menu-btn">🤖 Player vs A.I.</button>

            <div class="difficulty">
                <button class="diff-btn active" data-level="easy">Easy</button>
                <button class="diff-btn" data-level="medium">Medium</button>
                <button class="diff-btn" data-level="hard">Hard</button>
            </div>

            <button id="back-btn" class="menu-btn">← Back</button>
        </div>
    </div>

    <!-- GAME -->
    <div id="game-screen" class="screen">

        <button id="pause-btn" class="pause-btn">⏸</button>

        <div id="status" class="status">Player X Turn</div>

        <div id="board" class="board"></div>

        <!-- SCOREBOARD -->
        <div class="scoreboard">
            <div class="score-box">X: <span id="x-score">0</span></div>
            <div class="score-box">O: <span id="o-score">0</span></div>
            <div class="score-box">Draw: <span id="draw-score">0</span></div>
        </div>

    </div>

    <!-- OVERLAY -->
    <div id="overlay" class="overlay">
        <div class="overlay-box">
            <button id="resume-btn" class="menu-btn">Resume</button>
            <button id="restart-btn" class="menu-btn">Restart</button>
            <button id="exit-btn" class="menu-btn">Exit</button>
        </div>
    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
